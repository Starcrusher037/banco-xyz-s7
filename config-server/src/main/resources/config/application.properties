# Configuracion Compartida Servida por Spring Cloud Config Server

# Seguridad JWT Compartida
bank.jwt.secret=BancoXYZSuperSecretKeyClaveSeguraParaTokensJWT2026MovilWebATM
bank.jwt.expiration-ms=86400000

# Seguridad de Comunicacion Interna
bank.core.internal-api-key=SecretCoreKeyBancoXYZ2026

# Registro en Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator y Métricas
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
