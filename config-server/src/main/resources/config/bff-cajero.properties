# Configuracion centralizada para BFF Cajero
server.port=8083

# SSL / Keystore
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=bancoxyz2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bancoxyz

# URL Core Bancario
bank.core.url=https://localhost:8080/api/core

# Configuracion de Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.coreService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.coreService.sliding-window-size=10
resilience4j.circuitbreaker.instances.coreService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.coreService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.coreService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.coreService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.coreService.automatic-transition-from-open-to-half-open-enabled=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
