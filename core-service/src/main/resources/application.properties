spring.application.name=core-service
server.port=8080

# Clave compartida para validación de Service Tokens emitidos por los BFFs
service-token.secret=clave-compartida-bff-bancoxyz-service-token-2026-1234567890

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ActiveMQ Artemis JMS Broker Embebido
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.persistent=false
spring.jms.pub-sub-domain=false

# Resilience4j - Circuit Breaker y Retry para JMS y SAGA
resilience4j.circuitbreaker.instances.sagaJmsCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.sagaJmsCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.sagaJmsCB.waitDurationInOpenState=5000ms
resilience4j.circuitbreaker.instances.sagaJmsCB.permittedNumberOfCallsInHalfOpenState=3

resilience4j.circuitbreaker.instances.sagaConsumerCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.sagaConsumerCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.sagaConsumerCB.waitDurationInOpenState=5000ms
resilience4j.circuitbreaker.instances.sagaConsumerCB.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instances.sagaJmsCB.maxAttempts=3
resilience4j.retry.instances.sagaJmsCB.waitDuration=500ms

resilience4j.retry.instances.sagaConsumerCB.maxAttempts=3
resilience4j.retry.instances.sagaConsumerCB.waitDuration=500ms
