server.port=8080
spring.application.name=core-service

# Importar configuracion desde Config Server (si esta disponible)
spring.config.import=optional:configserver:http://localhost:8888

# Configuracion HTTPS / SSL con Certificado Digital
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=bancoxyz2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bancoxyz

# Clave secreta interna para que solo los BFFs autorizados puedan consultar el Core
bank.core.internal-api-key=SecretCoreKeyBancoXYZ2026

# Registro en Eureka Discovery Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
